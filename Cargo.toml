[package]
name = "sonoryn"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A protocol-first Discord music bot built on Gloamwire"
repository = "https://github.com/aliceblackrose/sonoryn"

[dependencies]
gloam-commands = { git = "https://github.com/aliceblackrose/gloam-macro-commands", rev = "21db6bb6050add656f51706c03c12ff80f6f709f", features = ["tracing"] }
gloamwire = { git = "https://github.com/aliceblackrose/gloamwire", branch = "main", features = ["cache", "tracing", "voice"] }
libdave-rs = { git = "https://github.com/mineygg/libdave-rs", rev = "100c9bca503ee3a5f29ea54db0af76589a42c9ca", default-features = false }
rand = "0.9"
rustypipe = "=0.11.4"
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"
