[package]
name = "sonoryn"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A protocol-first Discord music bot built on Gloamwire"
repository = "https://github.com/aliceblackrose/sonoryn"

[dependencies]
gloam-commands = { git = "https://github.com/aliceblackrose/gloam-macro-commands", rev = "6298b08793768f65da6cdcd88fb9e7bf0a7cb77d", features = ["tracing"] }
gloamwire = { git = "https://github.com/aliceblackrose/gloamwire", rev = "86633878229c4cbfaedfe2c5c524186f7bd683f9", features = ["cache", "tracing", "voice"] }
libdave-rs = { git = "https://github.com/mineygg/libdave-rs", rev = "100c9bca503ee3a5f29ea54db0af76589a42c9ca", default-features = false }
rand = "0.9"
strawcore-core = { git = "https://git.sulkta.com/Sulkta-OSS/strawcore", rev = "b231c84d9aaf5144dc1fc3d2b7fb2b4ce87b90a2" }
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls"] }
# Strawcore uses a blocking reqwest 0.12 client on the extraction worker pool.
reqwest12 = { package = "reqwest", version = "0.12", default-features = false, features = ["blocking", "gzip", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"
