[package]
name = "sonoryn"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A protocol-first Discord music bot built on Gloamwire"
repository = "https://github.com/aliceblackrose/sonoryn"

[dependencies]
gloam-commands = { git = "https://github.com/aliceblackrose/gloam-macro-commands", rev = "3bf89f40dee9f106b29d91ed8efa06c8ccf6955a", features = ["tracing"] }
gloamwire = { git = "https://github.com/aliceblackrose/gloamwire", rev = "ce7bedae12c255249d8823f5332f87566c7b363d", features = ["cache", "dave-davey", "tracing", "voice"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"
