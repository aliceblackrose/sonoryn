name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Verify single Gloamwire dependency
        run: |
          cargo metadata --format-version 1 > /tmp/sonoryn-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("/tmp/sonoryn-metadata.json").read_text())
          packages = [package for package in metadata["packages"] if package["name"] == "gloamwire"]
          identities = sorted({package["id"] for package in packages})
          if len(identities) != 1:
              raise SystemExit(
                  "expected exactly one Gloamwire package identity, resolved: "
                  + repr(identities)
              )
          print(f"Gloamwire dependency identity: {identities[0]}")
          PY

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
